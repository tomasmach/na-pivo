name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

permissions:
  contents: read

jobs:
  review:
    name: Claude review
    # Fork and Dependabot PRs do not receive repository secrets.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.type != 'Bot'
    # Job-level, so a skipped draft run does not cancel a real review.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      # Only people with repo access and this workflow's own comments reach the
      # model. The repo is public, so anyone can comment on a PR.
      - name: Collect trusted PR context
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          dir=.git/claude-review-context
          mkdir -p "$dir"
          trusted='select(.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR" or .user.login == "github-actions[bot]")'
          gh api "repos/$REPO/pulls/$PR" \
            --jq '{number, title, body, author: .user.login, head_sha: .head.sha, base_sha: .base.sha, base_ref: .base.ref}' \
            > "$dir/pr.json"
          gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq "[.[] | $trusted | {id, url: .html_url, author: .user.login, path, line, commit_id, in_reply_to_id, created_at, body}]" \
            | jq -s 'add // []' > "$dir/review-comments.json"
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq "[.[] | $trusted | {id, url: .html_url, author: .user.login, state, commit_id, submitted_at, body}]" \
            | jq -s 'add // []' > "$dir/reviews.json"
          gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq "[.[] | $trusted | {id, url: .html_url, author: .user.login, created_at, body}]" \
            | jq -s 'add // []' > "$dir/issue-comments.json"

      # Secret scrubbing and process isolation below need bubblewrap.
      - name: Install subprocess isolation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Review pull request
        uses: anthropics/claude-code-action@46a42b43239748e5b25771606bf1f551c3b1b517 # v1.0.232
        env:
          # Hide secrets from shell commands the model runs.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token can only read code and write PR comments, unlike the
          # Claude app token.
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD_SHA: ${{ github.event.pull_request.head.sha }}
            RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
            CONTEXT_DIR: .git/claude-review-context

            Read .github/claude-review.md and review this pull request exactly as
            it says.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(git diff:*)"
            --disallowedTools "Read(//proc/**)"
