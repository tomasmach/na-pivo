name: Bug report
description: Report a reproducible problem in the app or backend
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Search existing issues first and never include tokens, email addresses, raw GPS, private account data or production credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Tap ...
        3. See ...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - iOS app
        - Android app
        - Django backend
        - Local development setup
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: App 1.5.1, commit SHA, or branch name
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or sanitized logs
      description: Remove personal data, coordinates, tokens, cookies and request bodies before posting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This report contains no secrets or personal data.
          required: true
