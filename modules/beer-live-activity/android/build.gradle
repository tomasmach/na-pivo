plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.napivo'
version = '1.0.0'

def expoNotificationsVersion = new groovy.json.JsonSlurper()
  .parse(file('../../../node_modules/expo-notifications/package.json'))
  .version

android {
  namespace 'com.napivo.beerliveactivity'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // 1.18.0 is the newest stable Core compatible with Expo 56's compileSdk 36.
  // Core 1.19.0 requires compileSdk 37 and cannot be consumed by this release.
  implementation 'androidx.core:core-ktx:1.18.0'
  // The app already ships expo-notifications. Compile against its scheduler so
  // a background Live Activity action can move the existing reminder alarm.
  // Expo 56 autolinks prebuilt modules as Maven artifacts instead of Gradle
  // projects, so keep the compile dependency aligned with the installed package.
  compileOnly "host.exp.exponent:expo.modules.notifications:${expoNotificationsVersion}"
}
