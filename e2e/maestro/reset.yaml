appId: ${MAESTRO_APP_ID}
---
- runScript: local.js
- evalScript: >-
    ${output.local.reset(typeof SCENARIO === 'undefined' ? 'base' : SCENARIO)}
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          clearKeychain: true
          arguments:
            '--initialUrl': ${MAESTRO_METRO}
            '-EXDevMenuShowsAtLaunch': 'NO'
            '-EXDevMenuIsOnboardingFinished': 'YES'
            '-EXDevMenuShowFloatingActionButton': 'NO'
          permissions:
            all: deny
            location: inuse
            photos: allow
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            all: deny
            location: allow
            camera: deny
            notifications: deny
- evalScript: ${output.local.request('/app/open', {})}
- runFlow:
    when:
      platform: Android
    commands:
      # Expo shows its developer menu once after pm clear.
      - extendedWaitUntil:
          visible: 'Go home'
          timeout: 60000
      - tapOn: 'Close'
- extendedWaitUntil:
    visible:
      id: onboarding-skip
    timeout: 60000
