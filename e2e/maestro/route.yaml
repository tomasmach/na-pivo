appId: ${MAESTRO_APP_ID}
---
- openLink: ${'napivo:/' + ROUTE}
- runFlow:
    when:
      visible: 'Open|Otevřít'
    commands:
      - tapOn: 'Open|Otevřít'
- runFlow:
    when:
      visible: 'Teď ne, nech mě pít v klidu'
    commands:
      - tapOn: 'Teď ne, nech mě pít v klidu'
      - openLink: ${'napivo:/' + ROUTE}
