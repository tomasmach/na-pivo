appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          arguments:
            '--initialUrl': ${MAESTRO_METRO}
            '-EXDevMenuShowsAtLaunch': 'NO'
            '-EXDevMenuIsOnboardingFinished': 'YES'
            '-EXDevMenuShowFloatingActionButton': 'NO'
          permissions:
            all: deny
            location: inuse
            photos: allow
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            all: deny
            location: allow
            camera: deny
            notifications: deny
- evalScript: ${output.local.request('/app/open', {})}
- runFlow:
    when:
      platform: Android
    commands:
      # am start finishes before Expo has mounted the Router. Wait for the
      # actual navigation or unfinished onboarding before the next step. The
      # system tab bar keeps its testID in a view tag Maestro cannot read, so
      # the Kompas tab is matched by its accessibility label.
      - extendedWaitUntil:
          visible: {text: 'Kompas|Compass|Přeskočit|Skip'}
          timeout: 60000
- runFlow:
    when:
      visible: 'Teď ne, nech mě pít v klidu'
    commands:
      - tapOn: 'Teď ne, nech mě pít v klidu'
