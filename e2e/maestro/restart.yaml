appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          arguments:
            '--initialUrl': ${MAESTRO_METRO}
            '-EXDevMenuShowsAtLaunch': 'NO'
            '-EXDevMenuIsOnboardingFinished': 'YES'
            '-EXDevMenuShowFloatingActionButton': 'NO'
          permissions:
            all: deny
            location: inuse
            photos: allow
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            all: deny
            location: allow
            camera: deny
            notifications: deny
- evalScript: ${output.local.request('/app/open', {})}
- runFlow:
    when:
      visible: 'Teď ne, nech mě pít v klidu'
    commands:
      - tapOn: 'Teď ne, nech mě pít v klidu'
