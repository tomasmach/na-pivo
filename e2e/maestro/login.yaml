appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: route.yaml
    env:
      ROUTE: /nv/prihlaseni
- tapOn:
    id: auth-email
- inputText:
    text: >-
      ${typeof ACCOUNT === 'undefined' || ACCOUNT === 'primary' ? MAESTRO_EMAIL : ACCOUNT + '-' + MAESTRO_EMAIL}
    label: Enter disposable fixture email
# Known Android failure NP-E2E-019: the lifted submit button covers the password
# field, so a tap there submits. identity/login-keyboard.yaml keeps failing on it;
# the keyboard's next key reaches the field the same way a person can.
- pressKey: Enter
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: Enter disposable fixture password
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    notVisible:
      id: auth-submit
    timeout: 20000
- runFlow:
    when:
      visible: 'Not Now|Teď ne'
    commands:
      - tapOn: 'Not Now|Teď ne'
