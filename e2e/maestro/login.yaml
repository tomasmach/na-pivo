appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: route.yaml
    env:
      ROUTE: /nv/prihlaseni
- tapOn:
    id: auth-email
- inputText:
    text: >-
      ${typeof ACCOUNT === 'undefined' || ACCOUNT === 'primary' ? MAESTRO_EMAIL : ACCOUNT + '-' + MAESTRO_EMAIL}
    label: Enter disposable fixture email
- tapOn:
    id: auth-password
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: Enter disposable fixture password
# Known Android failure NP-E2E-018: the keyboard covers the submit button.
# identity/login-keyboard.yaml keeps failing on it; here the keyboard is
# closed so the other flows still reach the account they test.
- hideKeyboard
- tapOn:
    id: auth-submit
- extendedWaitUntil:
    notVisible:
      id: auth-submit
    timeout: 20000
- runFlow:
    when:
      visible: 'Not Now|Teď ne'
    commands:
      - tapOn: 'Not Now|Teď ne'
