appId: ${MAESTRO_APP_ID}
name: Offline private photos persist and remain isolated
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- evalScript: ${output.local.request('/media', {})}
- runScript:
    file: checks.js
    env:
      CASE: photos
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- tapOn: "Přidat fotku piva"
- tapOn: { id: photo-source-library }
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: { id: PXGGridLayout-Info, index: 0 }
          timeout: 15000
      - waitForAnimationToEnd
      - tapOn: { id: PXGGridLayout-Info, index: 0 }
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: { text: "Photo taken on .*", index: 0 }
          timeout: 15000
      - waitForAnimationToEnd
      - tapOn: { text: "Photo taken on .*", index: 0 }
- assertVisible: { id: photo-caption }
- tapOn: { id: photo-caption }
- eraseText
- inputText: "E2E soukromá"
- assertVisible: { id: photo-caption, text: "E2E soukromá" }
- tapOn: "POPISEK"
- scrollUntilVisible:
    element: { text: "Viditelnost fotky: Jen pro mě" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Viditelnost fotky: Jen pro mě"
- evalScript: ${output.local.offline()}
- scrollUntilVisible:
    element: { text: "Uložit do deníčku" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Uložit do deníčku"
- assertVisible: "Fotka piva, E2E soukromá. Ťukni pro detail."
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- assertVisible: "Fotka piva, E2E soukromá. Ťukni pro detail."
- evalScript: ${output.local.online()}
- runFlow: ../../maestro/foreground.yaml
- runScript:
    file: checks.js
    env:
      CASE: photos
      PHASE: private
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- tapOn: "Přidat fotku piva"
- tapOn: { id: photo-source-library }
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: { id: PXGGridLayout-Info, index: 0 }
          timeout: 15000
      - waitForAnimationToEnd
      - tapOn: { id: PXGGridLayout-Info, index: 0 }
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: { text: "Photo taken on .*", index: 0 }
          timeout: 15000
      - waitForAnimationToEnd
      - tapOn: { text: "Photo taken on .*", index: 0 }
- assertVisible: { id: photo-caption }
- tapOn: { id: photo-caption }
- eraseText
- inputText: "E2E pro partu"
- assertVisible: { id: photo-caption, text: "E2E pro partu" }
- tapOn: "POPISEK"
- scrollUntilVisible:
    element: { text: "Uložit do deníčku" }
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: "Uložit do deníčku"
- runScript:
    file: checks.js
    env:
      CASE: photos
      PHASE: shared
- tapOn: "Fotka piva, E2E soukromá. Ťukni pro detail."
- tapOn: "Smazat fotku"
- tapOn: { id: app-dialog-secondary-0 }
- runScript:
    file: checks.js
    env:
      CASE: photos
      PHASE: cancel
- tapOn: "Smazat fotku"
- tapOn: { id: app-dialog-primary }
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- assertNotVisible: "Fotka piva, E2E soukromá. Ťukni pro detail."
- assertVisible: "Fotka piva, E2E pro partu. Ťukni pro detail."
- evalScript: ${output.local.screenshot('identity-photo-private-isolated')}
- runScript:
    file: checks.js
    env:
      CASE: photos
      PHASE: final
