appId: ${MAESTRO_APP_ID}
name: Completed onboarding persists and offers native providers
tags: [full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- tapOn: { id: onboarding-next }
- assertVisible: "Čárkuj si večer"
- tapOn: { id: onboarding-next }
- assertVisible: { id: onboarding-auth }
- tapOn: "Založit účet"
- assertVisible: { id: auth-email }
- assertVisible: "Pokračovat přes Apple"
- assertVisible: "Pokračovat přes Google"
- tapOn: "Zpět"
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- assertVisible: "Vytvořit účet"
- assertNotVisible: { id: onboarding-skip }
- evalScript: ${output.local.screenshot('identity-onboarding-completed')}
- runScript:
    file: checks.js
    env:
      CASE: onboarding
      PHASE: final
