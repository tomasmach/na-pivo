appId: com.tomasmach.na-pivo
name: Badges match server and information works offline
tags: [full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript:
    file: checks.js
    env:
      CASE: badges
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/badges
- assertVisible: "Prvních 10 piv, zamčeno, Napočítej 10 piv"
- scrollUntilVisible:
    element: { text: "FotoPivař, splněno" }
    direction: DOWN
    timeout: 15000
- assertVisible: "FotoPivař, splněno"
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/badges
- assertVisible: "Prvních 10 piv, zamčeno, Napočítej 10 piv"
- scrollUntilVisible:
    element: { text: "FotoPivař, splněno" }
    direction: DOWN
    timeout: 15000
- assertVisible: "FotoPivař, splněno"
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /about
- scrollUntilVisible:
    element: { text: "E2E místní novinky" }
    direction: DOWN
    timeout: 15000
- assertVisible: "E2E místní novinky"
- evalScript: ${output.local.offline()}
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /privacy
- assertVisible: "Soukromí"
- scrollUntilVisible:
    element:
      text: "Průběžnou GPS historii, trasu pohybu ani jednotlivé GPS body neukládám\\."
    direction: DOWN
    timeout: 15000
- assertVisible: "Průběžnou GPS historii, trasu pohybu ani jednotlivé GPS body neukládám\\."
- assertVisible: "Zpět"
- tapOn: "Zpět"
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- assertVisible: "Upravit profil"
- evalScript: ${output.local.online()}
- evalScript: ${output.local.screenshot('identity-profile-badges-information')}
- runScript:
    file: checks.js
    env:
      CASE: badges
      PHASE: final
