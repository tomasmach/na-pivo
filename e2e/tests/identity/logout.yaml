appId: ${MAESTRO_APP_ID}
name: Offline logout isolates the next account
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runFlow: ../../maestro/counter.yaml
- tapOn: { id: counter-primary }
- tapOn: 'E2E Ležák, 41\sKč'
- tapOn: { id: drink-save }
- assertVisible: '1 pivo dnes večer'
- runScript:
    file: checks.js
    env:
      CASE: logout
      PHASE: online
- evalScript: ${output.local.offline()}
- runFlow: ../../maestro/repeat-beer.yaml
- assertVisible: '2 piva dnes večer'
- runFlow: ../../maestro/restart.yaml
- runFlow: ../../maestro/counter.yaml
- assertVisible: '2 piva dnes večer'
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- assertVisible: 'Odhlásit se'
- evalScript: ${output.local.screenshot('identity-account-offline-logout-after')}
- tapOn: 'Odhlásit se'
- extendedWaitUntil:
    visible:
      id: auth-submit
    timeout: 15000
- tapOn: 'Zatím bez účtu'
- runFlow: ../../maestro/restart.yaml
- runFlow: ../../maestro/dismiss-onboarding.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: 'Zatím bez účtu'
- evalScript: ${output.local.online()}
- runFlow:
    file: ../../maestro/login.yaml
    env:
      ACCOUNT: second
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: '@E2EKamarad'
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/stamgast
- assertVisible: '0 piv dnes večer'
- assertVisible: 'Zatím nic\. První pivo zapíšeš tlačítkem dole\.'
- evalScript: ${output.local.screenshot('identity-next-account-isolated')}
- runScript:
    file: checks.js
    env:
      CASE: logout
      PHASE: final
