appId: ${MAESTRO_APP_ID}
name: Denied media and picker cancel keep profile usable
tags: [full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- evalScript: ${output.local.request('/media', {})}
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          arguments:
            "--initialUrl": ${MAESTRO_METRO}
            "-EXDevMenuShowsAtLaunch": "NO"
            "-EXDevMenuIsOnboardingFinished": "YES"
            "-EXDevMenuShowFloatingActionButton": "NO"
          permissions:
            all: deny
            location: inuse
            photos: deny
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- tapOn: "Upravit profil"
- assertVisible: "E2EPivar"
- tapOn: { id: profile-avatar-pick }
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Otevřít Nastavení"
- runFlow:
    when:
      platform: Android
    commands:
      # Android's system picker does not require broad photo-library access.
      - extendedWaitUntil:
          visible: { text: "Photo taken on .*", index: 0 }
          timeout: 15000
      - pressKey: Back
- scrollUntilVisible:
    element: { id: profile-display-name }
    direction: DOWN
    timeout: 15000
- tapOn: { id: profile-display-name }
- eraseText
- inputText: "E2E Bez fotky"
- pressKey: Enter
- assertVisible: { id: profile-display-name, text: "E2E Bez fotky" }
- tapOn: { id: profile-save }
- extendedWaitUntil:
    notVisible: { id: profile-save }
    timeout: 20000
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- tapOn: "Přidat fotku piva"
- tapOn: { id: photo-source-camera }
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "Don’t allow"
- runFlow:
    when:
      visible: Zrušit
    commands:
      - tapOn: Zrušit
- runFlow:
    when:
      visible: { id: photo-source-close }
    commands:
      - tapOn: { id: photo-source-close }
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          arguments:
            "--initialUrl": ${MAESTRO_METRO}
            "-EXDevMenuShowsAtLaunch": "NO"
            "-EXDevMenuIsOnboardingFinished": "YES"
            "-EXDevMenuShowFloatingActionButton": "NO"
          permissions:
            all: deny
            location: inuse
            photos: allow
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile/photos
- tapOn: "Přidat fotku piva"
- tapOn: { id: photo-source-library }
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible: "Cancel|Zrušit"
      - tapOn: "Cancel|Zrušit"
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: { text: "Photo taken on .*", index: 0 }
          timeout: 15000
      - pressKey: Back
- runFlow:
    when:
      visible: { id: photo-source-close }
    commands:
      - tapOn: { id: photo-source-close }
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- tapOn: "Upravit profil"
- assertVisible: "E2E Bez fotky"
- tapOn: "Zavřít"
- evalScript: ${output.local.screenshot('identity-media-denied-recovered')}
- runScript:
    file: checks.js
    env:
      CASE: media
      PHASE: final
