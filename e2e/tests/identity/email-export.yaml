appId: ${MAESTRO_APP_ID}
name: Verified email unlocks an export containing only this account's private data
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity_export
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- assertVisible: 'E-mail ještě není ověřený\.'
- tapOn: 'Poslat moje data e-mailem'
# The toast is transient. Check the actual UI request.
- runScript:
    file: export-checks.js
    env: { PHASE: denied }
- tapOn: 'Poslat znovu'
- runScript:
    file: export-checks.js
    env: { PHASE: mail }
- evalScript: ${output.local.request('/mail/verify', {})}
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- assertVisible: 'E-mail ověřen'
- assertNotVisible: 'Poslat znovu'
- tapOn: 'Poslat moje data e-mailem'
- runScript:
    file: export-checks.js
    env: { PHASE: exported }
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- assertVisible: 'E-mail ověřen'
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: 'Upravit profil'
- evalScript: ${output.local.screenshot('identity-email-verified-exported')}
- runScript:
    file: export-checks.js
    env: { PHASE: final }
