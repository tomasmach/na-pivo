appId: ${MAESTRO_APP_ID}
name: Registration claims online and offline history under the same private account
# Blocked on iOS: the local React password category stayed "one", also with
# character-by-character input. Limits are documented in ../../COVERAGE.md.
tags: [critical, full, identity, blocked]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: registration
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/counter.yaml
- tapOn: { id: counter-primary }
- tapOn: 'E2E Ležák, 41\sKč'
- tapOn: { id: drink-save }
- assertVisible: '1 pivo dnes večer'
- runScript:
    file: checks.js
    env:
      CASE: register
      PHASE: anonymous
- evalScript: ${output.local.offline()}
- runFlow: ../../maestro/repeat-beer.yaml
- assertVisible: '2 piva dnes večer'
- runFlow: ../../maestro/restart.yaml
- runFlow: ../../maestro/counter.yaml
- assertVisible: '2 piva dnes večer'
- evalScript: ${output.local.online()}
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/prihlaseni
- tapOn: 'Registrovat'
- tapOn: { id: auth-email }
- inputText:
    text: ${MAESTRO_EMAIL}
    label: Enter disposable fixture email
- copyTextFrom: { id: auth-email }
- runScript:
    file: registration-input.js
    env: { PHASE: email }
- tapOn: { id: auth-password }
- inputText:
    text: ${MAESTRO_PASSWORD}
    label: Enter disposable fixture password
- tapOn: { id: auth-submit }
- evalScript: ${output.registrationError = 'none'}
- runFlow:
    when:
      visible: 'Heslo musí mít alespoň 8 znaků\.'
    commands:
      - evalScript: ${output.registrationError = 'password_short'}
- runScript:
    file: checks.js
    env:
      CASE: register
      PHASE: submitted
# A new account picks its nickname and visibility; private is the default.
- extendedWaitUntil:
    visible: { id: profile-nickname }
    timeout: 20000
- tapOn: { id: profile-nickname }
- inputText: 'E2ERegister'
- tapOn: { id: profile-save }
- extendedWaitUntil:
    notVisible: { id: profile-save }
    timeout: 20000
- runScript:
    file: checks.js
    env:
      CASE: register
      PHASE: claimed
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: '@E2ERegister'
- evalScript: ${output.local.screenshot('identity-registered-private')}
- runScript:
    file: checks.js
    env:
      CASE: register
      PHASE: final
