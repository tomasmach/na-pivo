appId: ${MAESTRO_APP_ID}
name: Account deletion confirms and revokes sessions
tags: [critical, full, identity]
# Known Android dev runtime failure: NP-E2E-016; see ../../BUGS.md.
# Retain deletion/revocation and UI assertions.
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- evalScript: ${output.local.check(output.local.observe('primary', '/v1/account/me').status === 200, 'Establish the cached observer before the app login so its deletion epoch stays current.')}
- runFlow: ../../maestro/login.yaml
- runFlow: ../../maestro/counter.yaml
- tapOn: { id: counter-primary }
- tapOn: 'E2E Ležák, 41\sKč'
- tapOn: { id: drink-save }
- assertVisible: '1 pivo dnes večer'
- runScript:
    file: checks.js
    env:
      CASE: delete
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- tapOn: 'Smazat účet'
- assertVisible: 'Smazat účet\?'
- tapOn: 'Zrušit'
- assertNotVisible: 'Smazat účet\?'
- runScript:
    file: checks.js
    env:
      CASE: delete
      PHASE: cancel
- tapOn: 'Smazat účet'
- assertVisible: 'Smazat účet\?'
- evalScript: ${output.local.debugScreenshot('identity-delete-dialog')}
- tapOn: 'Smazat'
- assertNotVisible: 'Smazat účet\?'
- evalScript: ${output.local.debugScreenshot('identity-delete-confirmed')}
- runScript:
    file: checks.js
    env:
      CASE: delete
      PHASE: deleted
- runFlow: ../../maestro/restart.yaml
- runFlow: ../../maestro/dismiss-onboarding.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: 'Zatím bez účtu'
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/stamgast
- assertVisible: '0 piv dnes večer'
- assertVisible: 'Zatím nic\. První pivo zapíšeš tlačítkem dole\.'
- evalScript: ${output.local.screenshot('identity-account-deleted')}
- runScript:
    file: checks.js
    env:
      CASE: delete
      PHASE: final
