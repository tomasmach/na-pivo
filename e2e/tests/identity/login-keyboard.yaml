appId: ${MAESTRO_APP_ID}
name: Sign-in keeps its fields and submit button usable above the keyboard
# Regressions NP-E2E-018 and NP-E2E-019; see ../../BUGS.md.
tags: [critical, full, identity]
---
- runFlow: ../../maestro/reset.yaml
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/prihlaseni
# The keyboard opens from the e-mail field first, as when a person signs in.
- tapOn: { id: auth-email }
- inputText: a@example.test
- waitForAnimationToEnd:
    timeout: 5000
- evalScript: ${output.local.screenshot('identity-login-keyboard-open')}
- assertVisible: { id: auth-submit }
- assertVisible: 'Zapomenuté heslo\?'
# The password field below must stay in view and take the tap, not the lifted button.
- tapOn: { id: auth-password }
- inputText: x
- assertNotVisible: 'Heslo musí mít alespoň 8 znaků\.'
- evalScript: ${output.local.screenshot('identity-login-password-focused')}
