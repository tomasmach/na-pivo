appId: ${MAESTRO_APP_ID}
name: Email reset rejects the old password and session
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /account
- tapOn: "Odhlásit se"
# The account header remains mounted during logout. Wait for its final
# router.back() before opening auth, so that late back cannot close auth.
- extendedWaitUntil:
    notVisible: "^Účet$"
    timeout: 20000
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /auth
- tapOn: { id: auth-reset-open }
- tapOn: { id: auth-reset-email }
- eraseText
- inputText: "${MAESTRO_EMAIL}"
- pressKey: Enter
- scrollUntilVisible:
    element: { id: auth-reset-request }
    direction: DOWN
    timeout: 15000
- tapOn: { id: auth-reset-request }
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: mail
- evalScript: ${output.local.request('/mail/reset', {})}
- assertVisible: { id: reset-password }
- assertNotVisible: { id: reset-code }
- tapOn: { id: reset-password }
- eraseText
- inputText: "${MAESTRO_NEW_PASSWORD}"
- pressKey: Enter
- tapOn: { id: reset-submit }
- extendedWaitUntil:
    notVisible: { id: reset-submit }
    timeout: 20000
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- tapOn: "Upravit profil"
- assertVisible: "E2E Pivař"
- tapOn: "Zavřít"
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: changed
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /account
- tapOn: "Odhlásit se"
- extendedWaitUntil:
    notVisible: "^Účet$"
    timeout: 20000
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /auth
- tapOn: { id: auth-email }
- eraseText
- inputText: "${MAESTRO_EMAIL}"
- tapOn: { id: auth-password }
- eraseText
- inputText: "${MAESTRO_PASSWORD}"
- tapOn: { id: auth-submit }
- assertVisible: { id: auth-error, text: "^Nesprávný e-mail nebo heslo\\.$" }
- tapOn: { id: auth-password }
- runFlow:
    when:
      platform: iOS
    commands:
      - eraseText
- runFlow:
    when:
      platform: Android
    commands:
      # A center tap can leave the caret inside the previous password.
      # Select the complete value before replacing it with the new credential.
      - longPressOn: { id: auth-password }
      - tapOn: { text: "^Select [Aa]ll$" }
      - eraseText: 1
- inputText: "${MAESTRO_NEW_PASSWORD}"
- tapOn: { id: auth-submit }
- extendedWaitUntil:
    notVisible: { id: auth-submit }
    timeout: 20000
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /profile
- tapOn: "Upravit profil"
- assertVisible: "E2E Pivař"
- tapOn: "Zavřít"
- evalScript: ${output.local.screenshot('identity-password-reset')}
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: final
