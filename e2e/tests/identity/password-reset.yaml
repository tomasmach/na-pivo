appId: ${MAESTRO_APP_ID}
name: Email reset rejects the old password and session
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- tapOn: 'Odhlásit se'
# Logout replaces the account screen with sign-in.
- extendedWaitUntil:
    visible: { id: auth-submit }
    timeout: 20000
- tapOn: { id: auth-email }
- inputText: '${MAESTRO_EMAIL}'
- tapOn: 'Zapomenuté heslo\?'
- extendedWaitUntil:
    visible: { id: reset-code }
    timeout: 20000
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: mail
- evalScript: ${output.local.request('/mail/reset', {})}
# The link carries its token, so the manual code field disappears.
- extendedWaitUntil:
    visible: { id: reset-password }
    timeout: 20000
- extendedWaitUntil:
    notVisible: { id: reset-code }
    timeout: 20000
- tapOn: { id: reset-password }
- inputText: '${MAESTRO_NEW_PASSWORD}'
- tapOn: { id: reset-submit }
- extendedWaitUntil:
    notVisible: { id: reset-submit }
    timeout: 20000
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: '@E2EPivar'
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: changed
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/ucet
- tapOn: 'Odhlásit se'
- extendedWaitUntil:
    visible: { id: auth-submit }
    timeout: 20000
- tapOn: { id: auth-email }
- inputText: '${MAESTRO_EMAIL}'
- tapOn: { id: auth-password }
- inputText: '${MAESTRO_PASSWORD}'
- tapOn: { id: auth-submit }
- assertVisible: 'Nesprávný e-mail nebo heslo\.'
# A fresh form for the new password, so no part of the rejected input stays.
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/prihlaseni
- tapOn: { id: auth-email }
- inputText: '${MAESTRO_EMAIL}'
- tapOn: { id: auth-password }
- inputText: '${MAESTRO_NEW_PASSWORD}'
- tapOn: { id: auth-submit }
- extendedWaitUntil:
    notVisible: { id: auth-submit }
    timeout: 20000
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: '@E2EPivar'
- waitForAnimationToEnd:
    timeout: 5000
- evalScript: ${output.local.screenshot('identity-password-reset')}
- runScript:
    file: checks.js
    env:
      CASE: reset
      PHASE: final
