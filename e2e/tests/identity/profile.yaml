appId: ${MAESTRO_APP_ID}
name: Profile edits persist and hide the private profile
tags: [critical, full, identity]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: identity
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript:
    file: checks.js
    env:
      CASE: profile
      PHASE: before
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/upravit-profil
- assertVisible: { id: profile-nickname, text: '@ E2EPivar' }
- tapOn: { id: profile-nickname }
- eraseText
- inputText: 'E2EKamarad'
- hideKeyboard
- tapOn: { id: profile-save }
# The new look checks uniqueness on save; the form stays open with the error.
- extendedWaitUntil:
    visible: 'Tahle přezdívka je zabraná'
    timeout: 15000
- evalScript: ${output.local.screenshot('identity-nickname-validation')}
- tapOn: { id: profile-nickname }
- eraseText
- inputText: 'E2EUpdated'
- hideKeyboard
- assertVisible: { id: profile-nickname, text: '@ E2EUpdated' }
- tapOn: { id: profile-display-name }
- eraseText
- inputText: 'E2E Upravený'
- hideKeyboard
- assertVisible: { id: profile-display-name, text: 'E2E Upravený' }
- scrollUntilVisible:
    element: { id: profile-public }
    direction: DOWN
    timeout: 15000
- tapOn: { id: profile-public }
- evalScript: ${output.local.screenshot('identity-profile-before-save')}
- tapOn: { id: profile-save }
- extendedWaitUntil:
    notVisible: { id: profile-save }
    timeout: 20000
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/profil
- assertVisible: '@E2EUpdated'
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/upravit-profil
- assertVisible: { id: profile-display-name, text: 'E2E Upravený' }
- evalScript: ${output.local.screenshot('identity-profile-private')}
- runScript:
    file: checks.js
    env:
      CASE: profile
      PHASE: final
