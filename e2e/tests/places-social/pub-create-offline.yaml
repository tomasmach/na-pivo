appId: ${MAESTRO_APP_ID}
name: Confirmed map pin queues one pub and rename preserves its identity
tags: [critical, full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/pridat-hospodu
- evalScript: ${output.local.offline()}
- hideKeyboard
- tapOn: Nemůžu svoji hospodu najít
- tapOn: { id: add-pub-name }
- inputText: E2E Nová hospoda
- tapOn: { id: add-pub-city }
- inputText: Praha
- tapOn: { id: add-pub-address }
- inputText: E2E Ulice 12
- hideKeyboard
- scrollUntilVisible:
    element: Zapíchnout špendlík do mapy
    direction: DOWN
    centerElement: true
- tapOn: Zapíchnout špendlík do mapy
# The pin map starts on the current position, which is the synthetic fixture point.
- extendedWaitUntil:
    visible: Použít
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 5000
- evalScript: ${output.local.screenshot('places-new-pub-map-pin')}
- tapOn: Použít
- extendedWaitUntil:
    visible: { id: add-pub-save, enabled: true }
    timeout: 15000
- tapOn: { id: add-pub-save }
- extendedWaitUntil:
    visible: Čeká na odeslání
    timeout: 15000
- assertVisible: E2E Nová hospoda
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/moje-hospody
- assertVisible: E2E Nová hospoda
- assertVisible: Čeká na odeslání
- evalScript: ${output.local.online()}
- runFlow: ../../maestro/foreground.yaml
- evalScript: ${output.local.poll(function () { output.ps.check('pub-created'); }, 15000)}
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/moje-hospody
- extendedWaitUntil:
    notVisible: Čeká na odeslání
    timeout: 15000
- assertVisible: E2E Nová hospoda
- evalScript: ${output.local.screenshot('places-added-pub-delivered')}
- evalScript: ${output.ps.check('pub-created')}
- tapOn: E2E Nová hospoda
- extendedWaitUntil:
    visible: { id: add-pub-name }
    timeout: 15000
- tapOn: { id: add-pub-name }
- eraseText
- inputText: E2E Přejmenovaná hospoda
- hideKeyboard
- tapOn: { id: add-pub-save, enabled: true }
- evalScript: ${output.local.poll(function () { output.ps.check('pub-renamed'); }, 15000)}
- extendedWaitUntil:
    visible: E2E Přejmenovaná hospoda
    timeout: 15000
- assertNotVisible: E2E Nová hospoda
- evalScript: ${output.local.screenshot('places-published-owner-edit')}
- evalScript: ${output.ps.check('pub-renamed')}
