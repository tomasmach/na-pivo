appId: ${MAESTRO_APP_ID}
name: Denied location and camera preserve manual search and text feedback
tags: [full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- runFlow:
    when:
      platform: iOS
    commands:
      - launchApp:
          arguments:
            '--initialUrl': ${MAESTRO_METRO}
            '-EXDevMenuShowsAtLaunch': 'NO'
            '-EXDevMenuIsOnboardingFinished': 'YES'
            '-EXDevMenuShowFloatingActionButton': 'NO'
          permissions:
            all: deny
            location: never
            photos: allow
            camera: deny
            notifications: deny
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          permissions:
            all: deny
            location: deny
            camera: deny
            notifications: deny
      - evalScript: ${output.local.request('/app/open', {})}
      - extendedWaitUntil:
          visible: {id: tab-index}
          timeout: 60000
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /
- assertVisible: Potřebuju tvoji polohu
- tapOn: Otevřít mapu bez polohy
- assertVisible: Pivní mapa hospod, navštívených míst a kamarádů
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /pub-search
- tapOn: Hledat hospodu
- inputText: E2E NenalezitelnyPodnik
- assertVisible: Nic jsem nenašel
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /report
- tapOn: Přidat přílohu
- tapOn: Vyfotit
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: 'Don’t allow'
- assertVisible: Bez povolení to nepůjde
- runFlow:
    when: {visible: Zrušit}
    commands:
      - tapOn: Zrušit
- runFlow:
    when: {visible: OK}
    commands:
      - tapOn: OK
- scrollUntilVisible:
    element: {id: feedback-message}
    direction: UP
- tapOn: {id: feedback-message}
- inputText: E2E Kamera odmítnuta
# The multiline keyboard can cover submit; dismiss it through the static label.
- scrollUntilVisible:
    element: {text: 'Fotka nebo screenshot \(nepovinné\)'}
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn: 'Fotka nebo screenshot \(nepovinné\)'
- waitForAnimationToEnd:
    timeout: 5000
- scrollUntilVisible:
    element: {text: Odeslat zpětnou vazbu}
    direction: DOWN
    centerElement: true
- tapOn: Odeslat zpětnou vazbu
- assertVisible: Díky!
- evalScript: ${output.local.poll(function () { output.ps.check('denied-feedback'); }, 15000)}
- evalScript: ${output.local.screenshot('places-denied-camera-feedback')}
- evalScript: ${output.ps.check('denied-feedback')}
