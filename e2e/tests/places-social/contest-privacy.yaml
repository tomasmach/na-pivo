appId: com.tomasmach.na-pivo
name: Contest consent keeps diary photos private and moves one vote
tags: [critical, full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /photo-contest
- scrollUntilVisible:
    element: {text: Přihlásit fotku E2E Fotka E2EPivar do soutěže}
    direction: DOWN
- tapOn: Přihlásit fotku E2E Fotka E2EPivar do soutěže
- tapOn: Přihlásit fotku
- evalScript: ${output.local.poll(function () { output.ps.check('contest-entered'); }, 15000)}
- scrollUntilVisible:
    element: {text: 'Dát hlas fotce od @E2EKamos'}
    direction: DOWN
- tapOn: 'Dát hlas fotce od @E2EKamos'
- evalScript: ${output.local.poll(function () { output.ps.check('vote-friend'); }, 15000)}
- scrollUntilVisible:
    element: {text: 'Dát hlas fotce od @E2ECizi'}
    direction: UP
- tapOn: 'Dát hlas fotce od @E2ECizi'
- evalScript: ${output.local.poll(function () { output.ps.check('vote-outsider'); }, 15000)}
- tapOn: 'Vzít hlas fotce od @E2ECizi'
- evalScript: ${output.local.poll(function () { output.ps.check('vote-none'); }, 15000)}
- scrollUntilVisible:
    element: {text: Stáhnout ze soutěže}
    direction: UP
- tapOn: Stáhnout ze soutěže
- tapOn: Stáhnout ze soutěže
- evalScript: ${output.local.poll(function () { output.ps.check('contest-withdrawn'); }, 15000)}
- assertNotVisible: Stáhnout ze soutěže
- assertVisible: Vyfotit soutěžní fotku
- evalScript: ${output.local.screenshot('social-contest-withdrawn')}
- evalScript: ${output.ps.check('contest-withdrawn')}
