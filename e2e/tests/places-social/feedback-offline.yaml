appId: ${MAESTRO_APP_ID}
name: Offline feedback survives restart and is delivered exactly once
tags: [critical, full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/napis-mi
- evalScript: ${output.local.request('/media', {})}
- evalScript: ${output.local.offline()}
- tapOn: { id: feedback-message }
- inputText: E2E Test zprávy bez signálu.
- hideKeyboard
- tapOn: Přidat přílohu
- tapOn: Vybrat z galerie
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: {id: PXGGridLayout-Info, index: 0}
          timeout: 15000
      - waitForAnimationToEnd
      - evalScript: ${output.local.screenshot('places-feedback-gallery')}
      # The first thumbnail is a seeded synthetic image; other simulator stock photos may follow.
      - tapOn: {id: PXGGridLayout-Info, index: 0}
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: {text: 'Photo taken on .*', index: 0}
          timeout: 15000
      - waitForAnimationToEnd
      - evalScript: ${output.local.screenshot('places-feedback-gallery')}
      - tapOn: {text: 'Photo taken on .*', index: 0}
      - runFlow:
          when: {visible: Done}
          commands:
            - tapOn: Done
- extendedWaitUntil:
    visible: Odebrat přílohu
    timeout: 15000
- tapOn: Odeslat
- assertVisible: Díky!
- assertVisible: 'Zpráva dorazí, i kdyby teď zrovna nebylo připojení\. Odešlu ji, jakmile budeš online\.'
- evalScript: ${output.local.screenshot('places-feedback-queued')}
- runFlow: ../../maestro/restart.yaml
- evalScript: ${output.local.online()}
- runFlow: ../../maestro/foreground.yaml
- evalScript: ${output.local.poll(function () { output.ps.check('feedback'); }, 15000)}
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/napis-mi
- assertVisible: Napiš mi
- evalScript: ${output.local.screenshot('places-feedback-delivered')}
- evalScript: ${output.ps.check('feedback')}
