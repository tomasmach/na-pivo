# Known visual ambiguity NP-E2E-005: ../../BUGS.md. Automatic sharing and explicit cink have separate documented API contracts; a green flow does not resolve the toggle wording.
appId: com.tomasmach.na-pivo
name: Sharing ghost mode and blocking revoke real friend API access
tags: [critical, full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
# Observer login must precede UI login so it cannot rotate the app's write epoch.
- evalScript: ${output.local.check(output.local.observe('primary', '/v1/friends/live').status === 200, 'The primary observer is authenticated before the UI session.')}
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- evalScript: ${output.ps.check('privacy-baseline')}
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /friends
- assertVisible: 'Co ještě\? Nastavení, žebříčky a další'
- evalScript: ${output.local.screenshot('social-party-settings-after')}
- tapOn: 'Co ještě\? Nastavení, žebříčky a další'
- tapOn: Nastavení party
- tapOn: {id: friend-settings-sharing}
- evalScript: ${output.local.poll(function () { output.ps.check('sharing-off'); }, 15000)}
- evalScript: ${output.local.screenshot('social-sharing-off-settings')}
- tapOn: {id: friend-settings-close}
- assertNotVisible: Nastavení party
- tapOn: 'Co ještě\? Nastavení, žebříčky a další'
- tapOn: Nastavení party
- tapOn: {id: friend-settings-sharing}
- tapOn: {id: friend-settings-ghost}
- tapOn: {id: friend-settings-close}
- assertNotVisible: Nastavení party
- evalScript: ${output.local.poll(function () { output.ps.check('ghost-on'); }, 15000)}
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: ${'/parta/' + output.local.state().scenario.fixtureAccounts.E2EKamos}
- tapOn: Další možnosti
- tapOn: Zablokovat
- tapOn: Zablokovat
- evalScript: ${output.local.poll(function () { output.ps.check('blocked'); }, 15000)}
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /friends
- assertNotVisible: '.*E2EKamos.*'
- evalScript: ${output.local.screenshot('social-blocked-party')}
- evalScript: ${output.ps.check('blocked')}
