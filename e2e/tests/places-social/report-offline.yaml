appId: ${MAESTRO_APP_ID}
name: Cancelled report is inert and offline report hides only for its author
tags: [critical, full]
---
- runFlow:
    file: ../../maestro/reset.yaml
    env:
      SCENARIO: places_social
- runFlow: ../../maestro/skip-onboarding.yaml
- runFlow: ../../maestro/login.yaml
- runScript: oracle.js
- runFlow:
    file: ../../maestro/open-pub.yaml
    env: { PUB: E2E Druhá hospoda }
- tapOn: Další
- tapOn: Hospoda už nefunguje
- assertVisible: 'Nahlásit „E2E Druhá hospoda“\?'
- tapOn: Zpátky
- assertNotVisible: 'Nahlásit „E2E Druhá hospoda“\?'
- evalScript: ${output.ps.check('report-none')}
- evalScript: ${output.local.offline()}
- tapOn: Další
- tapOn: Hospoda už nefunguje
- tapOn: Nahlásit
- assertNotVisible: 'Nahlásit „E2E Druhá hospoda“\?'
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env:
      ROUTE: /nv/hledani
- tapOn: { id: pub-search-input }
- inputText: E2E Druhá
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible: '.*E2E Druhá hospoda.*'
- evalScript: ${output.local.screenshot('places-reported-hidden-offline')}
- evalScript: ${output.local.online()}
- runFlow: ../../maestro/foreground.yaml
- evalScript: ${output.local.poll(function () { output.ps.check('reported'); }, 15000)}
- evalScript: ${output.ps.check('reported')}
