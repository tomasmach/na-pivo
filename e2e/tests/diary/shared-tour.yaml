appId: ${MAESTRO_APP_ID}
name: Tour imports once and withdrawing both links preserves the original plan
tags: [critical, full, diary]
---
- runFlow: flows/start.flow
- runFlow:
    file: flows/create-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- tapOn:
    id: tour-save
- tapOn: Možnosti tour
- tapOn:
    id: tour-private-link-open
- tapOn: Vytvořit odkaz
- scrollUntilVisible:
    element: Kopírovat odkaz
    direction: DOWN
- tapOn: Kopírovat odkaz
- evalScript: ${output.local.request('/capability/store', { name:'private-tour' })}
- runScript:
    file: shared-tour.js
    env: { STAGE: private }
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- tapOn: Možnosti tour
- tapOn: Zveřejnit pro všechny
- evalScript: ${output.local.screenshot('diary-tour-public-preview')}
- tapOn:
    id: tour-publish
- evalScript: ${output.local.screenshot('diary-tour-after-public-submit')}
- runScript:
    file: shared-tour.js
    env: { STAGE: public }
# Native public Copy remains unverified (../../COVERAGE.md).
# Discover the actual public capability through the anonymous catalog API.
- runScript:
    file: shared-tour.js
    env: { STAGE: links }
- runFlow: flows/logout.flow
- runFlow:
    file: ../../maestro/login.yaml
    env: { ACCOUNT: second }
- evalScript: ${output.local.request('/capability/open', { name:'private-tour' })}
- tapOn: Uložit tour
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- evalScript: ${output.local.request('/capability/open', { name:'private-tour' })}
- tapOn: Otevřít uloženou tour
- runFlow:
    file: ../../maestro/route.yaml
    env: { ROUTE: /tours }
- assertVisible:
    text: '.*E2E Sdílená tour.*'
    index: 0
- assertNotVisible:
    text: '.*E2E Sdílená tour.*'
    index: 1
- evalScript: ${output.local.screenshot('diary-imported-tour-once')}
- runFlow: flows/logout.flow
- runFlow: ../../maestro/login.yaml
- runFlow:
    file: ../../maestro/route.yaml
    env: { ROUTE: /tours }
- tapOn: Obnovit plány z účtu
- tapOn: Zavřít
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- tapOn: Možnosti tour
- tapOn: Stáhnout z veřejných
- tapOn:
    id: app-dialog-primary
- extendedWaitUntil:
    notVisible:
      id: app-dialog-primary
    timeout: 10000
- runScript:
    file: shared-tour.js
    env: { STAGE: unpublished }
# Reopen after restart to prove persistence between public and private revocation.
# Repeated action-menu accessibility in the same process remains unverified.
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- tapOn: Možnosti tour
- evalScript: ${output.local.screenshot('diary-tour-options-after-unpublish')}
- tapOn:
    id: tour-private-link-open
- scrollUntilVisible:
    element: Zrušit odkaz
    direction: DOWN
- tapOn: Zrušit odkaz
- tapOn:
    id: app-dialog-primary
- extendedWaitUntil:
    notVisible:
      id: app-dialog-primary
    timeout: 10000
- runScript:
    file: shared-tour.js
    env: { STAGE: revoked }
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Sdílená tour }
- tapOn: Možnosti tour
- assertVisible: Zveřejnit pro všechny
- assertNotVisible: Sdílet veřejný odkaz
- assertNotVisible: Stáhnout z veřejných
- tapOn:
    id: tour-private-link-open
- assertVisible: Vytvořit odkaz
- assertNotVisible: Zrušit odkaz
- evalScript: ${output.local.screenshot('diary-tour-links-withdrawn')}
- runScript:
    file: shared-tour.js
    env: { STAGE: revoked }
