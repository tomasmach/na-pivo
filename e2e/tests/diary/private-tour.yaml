appId: com.tomasmach.na-pivo
name: Private offline tour retains its completed journey and counted beer
tags: [critical, full, diary]
---
- runFlow: flows/start.flow
- runFlow:
    file: flows/create-tour.flow
    env: { TOUR_TITLE: E2E Soukromá tour }
- evalScript: ${output.local.offline()}
- tapOn:
    id: tour-save
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Soukromá tour }
- tapOn: Vyrazit
- tapOn: Zapsat pivo na jedničce
- runFlow:
    file: flows/other-beer.flow
    env: { BEER_NAME: E2E Tour, BEER_PRICE: '41', FIRST_BEER: 'true' }
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Soukromá tour }
- assertVisible: '1\. E2E U Testera\..*1 pivo.*'
- assertVisible: '2\. E2E Druhá hospoda\. Další zastávka.*'
- tapOn: '2\. E2E Druhá hospoda.*'
- tapOn: Přeskočit zastávku
- tapOn: Ukončit tour
- tapOn: Ukončit tour
- runFlow: ../../maestro/restart.yaml
- runFlow:
    file: flows/open-tour.flow
    env: { TOUR_TITLE: E2E Soukromá tour }
- scrollUntilVisible:
    element: 'Předchozí průchod\..*'
    direction: DOWN
    centerElement: true
- waitForAnimationToEnd:
    timeout: 5000
- evalScript: ${output.local.screenshot('diary-private-history-row')}
- tapOn: 'Předchozí průchod\..*'
- extendedWaitUntil:
    visible: Vytvořit kopii
    timeout: 10000
- assertVisible: '1\. E2E U Testera\. Navštíveno · 1 pivo'
- assertVisible: '2\. E2E Druhá hospoda\. Přeskočeno'
- assertVisible: Vytvořit kopii
- assertNotVisible: Zapsat pivo na jedničce
- evalScript: ${output.local.online()}
- runFlow: ../../maestro/foreground.yaml
- assertVisible: Vytvořit kopii
- runScript: private-tour.js
- evalScript: ${output.local.screenshot('diary-private-tour-history')}
- runScript: private-tour.js
