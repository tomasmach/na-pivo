# Applied by deploy.py. Journald retains logs when Compose replaces containers.
# The host must have persistent journald storage; do not alter other apps' limits.
services:
  napivo-web:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
  worker:
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
  caddy:
    image: caddy:2.11.9
    container_name: napivo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # A directory mount, so the container sees the file a new checkout writes.
      - ./caddy:/etc/caddy:ro
      - napivo_media:/srv/napivo-media:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

volumes:
  caddy_data:
  caddy_config:
