<!doctype html>
{% load i18n %}
<html lang="{{ LANGUAGE_CODE }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#201006">
    <meta name="robots" content="noindex, nofollow">
    <title>{{ page_title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="canonical" href="{{ canonical_url }}">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <meta property="og:type" content="website">
    <meta property="og:locale" content="{{ og_locale }}">
    <meta property="og:site_name" content="Na pivo">
    <meta property="og:title" content="{{ page_title }}">
    <meta property="og:description" content="{{ description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    <meta property="og:image" content="{{ og_image_url }}">
    <meta property="og:image:secure_url" content="{{ og_image_url }}">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{% trans "Tři půllitry si připíjejí. Přidej se k partě." %}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page_title }}">
    <meta name="twitter:description" content="{{ description }}">
    <meta name="twitter:image" content="{{ og_image_url }}">

    <style>
      :root {
        color-scheme: dark;
        --stout: #201006;
        --stout-2: #2c170a;
        --amber: #f2a900;
        --foam: #fff1d6;
        --muted: #d8bea0;
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background: var(--stout);
        color: var(--foam);
        font-family: "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
      }

      main {
        width: min(100% - 32px, 560px);
        margin: 0 auto;
        padding: max(28px, env(safe-area-inset-top)) 0 max(36px, env(safe-area-inset-bottom));
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--amber);
        font-size: 15px;
        font-weight: 900;
        letter-spacing: .13em;
      }

      .brand img { width: 34px; height: 34px; }

      .art {
        display: block;
        width: 100%;
        height: auto;
        margin: 28px 0 30px;
        border: 1px solid #4b2b12;
        border-radius: 22px;
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 10vw, 58px);
        line-height: .98;
        letter-spacing: -.035em;
      }

      p {
        margin: 18px 0 26px;
        color: var(--muted);
        font-family: system-ui, sans-serif;
        font-size: 18px;
        line-height: 1.5;
      }

      .open-app {
        display: flex;
        min-height: 58px;
        align-items: center;
        justify-content: center;
        border: 2px solid var(--amber);
        border-radius: 18px;
        background: var(--amber);
        color: var(--stout);
        font-size: 18px;
        font-weight: 900;
        text-decoration: none;
      }

      .open-app:focus-visible {
        outline: 3px solid var(--foam);
        outline-offset: 4px;
      }

      .hint {
        margin: 16px 8px 0;
        color: #a98669;
        font-size: 14px;
        line-height: 1.45;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">
        <img src="/apple-touch-icon.png" alt="" width="34" height="34">
        <span>NA PIVO</span>
      </div>
      <img class="art" src="/og/invite.png" alt="{% trans "Tři půllitry si připíjejí" %}" width="1200" height="630">
      <h1>{{ headline }}</h1>
      <p>{{ body }}</p>
      <a class="open-app" href="{{ deep_link }}">{% trans "Otevřít v appce" %}</a>
      <div class="hint">{% trans "Když se nic nestane, nainstaluj nebo aktualizuj Na pivo a klepni znovu." %}</div>
    </main>
  </body>
</html>
