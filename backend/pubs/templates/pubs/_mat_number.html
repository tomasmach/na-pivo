{% comment %}A number on a beer mat. The number itself is the hidden text, so copying a mat gives "56 Kč" once.{% endcomment %}<span class="price"><span class="sr-only">{{ number }}{% if unit %} {{ unit }}{% endif %}</span><span class="roll" aria-hidden="true">{% for digit in number|stringformat:"d" %}<span class="digit" data-d="{{ digit }}"></span>{% endfor %}</span>{% if unit %}<span class="unit" aria-hidden="true">{{ unit }}</span>{% endif %}</span>
