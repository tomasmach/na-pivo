{% include "pubs/web/_chrome.html" %}
<style>
  /* The app's gray ground and amber accent (DESIGN.md §2.1). Every file comes from na-pivo.cz. */
  @font-face {
    font-family: "Baloo 2";
    src: url("{{ asset.baloo2_extrabold_woff2 }}") format("woff2");
    font-weight: 700 800;
    font-display: swap;
  }
  @font-face {
    font-family: "Bricolage Grotesque";
    src: url("{{ asset.bricolage_grotesque_woff2 }}") format("woff2");
    font-weight: 400 700;
    font-display: swap;
  }
  :root {
    color-scheme: dark;
    --ground: #15120F;
    --raised: #1C1815;
    --field: #262019;
    --deep: #0E0C0A;
    --foam: #FBF3E0;
    --foam-muted: #E8DCC0;
    --muted: #958E85;
    --amber: #E8A317;
    --open: #F0BE5C;
    --hair: rgb(251 243 224 / 0.10);
    --hair-strong: rgb(251 243 224 / 0.16);
    --display: "Baloo 2", ui-rounded, system-ui, sans-serif;
    --text: "Bricolage Grotesque", system-ui, sans-serif;
    --gutter: clamp(16px, 4vw, 40px);
    --page: 1200px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--ground); color: var(--foam); font: 400 16px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  p { margin: 0; text-wrap: pretty; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  h1 { font: 800 clamp(34px, 5vw, 52px)/1.05 var(--display); letter-spacing: -0.005em; }
  h2 { font: 700 19px/1.3 var(--text); }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 3px solid var(--foam); outline-offset: 3px; border-radius: 6px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .skip { position: absolute; left: 16px; top: -80px; z-index: 50; padding: 12px 16px; border-radius: 12px; background: var(--foam); color: var(--ground); font-weight: 700; text-decoration: none; }
  .skip:focus { top: 12px; }

  .page { max-width: var(--page); margin: 0 auto; padding: 28px var(--gutter) 64px; }
  .crumb { display: flex; flex-wrap: wrap; gap: 6px; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .crumb a { color: var(--foam-muted); text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 3px; }
  .lede { color: var(--foam-muted); font-size: 16px; margin-top: 10px; max-width: 64ch; }
  .muted { color: var(--muted); }
  .note { color: var(--muted); font-size: 13.5px; margin-top: 14px; max-width: 72ch; }
  .open { color: var(--open); font-weight: 600; }
  .band { height: 10px; background: var(--deep); margin: 28px calc(-1 * var(--gutter)); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--amber); color: var(--ground); font: 700 15px/1 var(--text); text-decoration: none; cursor: pointer; }
  .btn:hover { background: #F5B642; }
  .btn:active { transform: translateY(1px); }
  .quiet { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 0; border-radius: 11px; background: var(--field); color: var(--foam); font: 600 14px/1 var(--text); text-decoration: none; cursor: pointer; }
  .quiet:hover { background: #2E271F; }
  .link { color: var(--foam-muted); font-weight: 600; text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 4px; display: inline-flex; align-items: center; min-height: 44px; }

  /* A row of a list: name and meta on the left, the price on the right. */
  .rows { list-style: none; margin: 0; padding: 0; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; padding: 14px 0; border-top: 1px solid var(--hair); }
  .row:first-child { border-top: 0; }
  .row .name { font-weight: 700; font-size: 16.5px; line-height: 1.3; text-decoration: none; }
  .row .name:hover { text-decoration: underline; text-decoration-color: var(--hair-strong); text-underline-offset: 3px; }
  .row .meta, .row .taps { grid-column: 1; font-size: 14px; }
  .row .meta { color: var(--muted); }
  .row .taps { color: var(--foam-muted); }
  .row .price { grid-column: 2; grid-row: 1 / span 3; text-align: right; font: 800 22px/1.1 var(--display); white-space: nowrap; }
  .row .price small { display: block; font: 500 12.5px/1.35 var(--text); color: var(--muted); }
  .event { color: var(--amber); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1px solid transparent; border-radius: 999px; background: var(--raised); color: var(--foam-muted); font: 600 14px/1 var(--text); text-decoration: none; white-space: nowrap; cursor: pointer; }
  .chip:hover { color: var(--foam); }
  .chip[aria-pressed="true"], .chip.on { border-color: rgb(232 163 23 / 0.5); background: rgb(232 163 23 / 0.12); color: var(--foam); }

  /* Map pins: the price on a quiet pill, amber only for the selected pub. */
  .pin { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 26px; padding: 0 9px; border-radius: 999px; background: var(--field); color: var(--foam); font: 700 13px/1 var(--text); text-decoration: none; box-shadow: 0 0 0 1.5px rgb(251 243 224 / 0.18), 0 2px 6px rgb(0 0 0 / 0.5); cursor: pointer; }
  .pin::after { content: ""; position: absolute; left: 50%; bottom: -4px; width: 8px; height: 8px; background: inherit; transform: translateX(-50%) rotate(45deg); z-index: -1; }
  .pin.on, .pin:hover, .pin:focus-visible { background: var(--amber); color: var(--ground); z-index: 3; }
  .pin.dot { min-width: 0; width: 12px; height: 12px; padding: 0; }
  .pin.dot::after { display: none; }
  .is-far .pin:not(.on):not(:hover) { min-width: 0; width: 11px; height: 11px; padding: 0; font-size: 0; background: #E8DCC0; box-shadow: 0 0 0 2px #15120F; }
  .is-far .pin:not(.on):not(:hover)::after { display: none; }
  .maplibregl-ctrl-group { background: var(--field) !important; border-radius: 12px !important; box-shadow: 0 0 0 1px var(--hair-strong) !important; overflow: hidden; }
  .maplibregl-ctrl-group button { width: 44px !important; height: 44px !important; }
  .maplibregl-ctrl-group button + button { border-top: 1px solid var(--hair) !important; }
  .maplibregl-ctrl-group .maplibregl-ctrl-icon { filter: invert(1) sepia(0.2); }
  .maplibregl-ctrl-attrib, .maplibregl-ctrl-attrib-button { background-color: rgb(21 18 15 / 0.8) !important; color: var(--muted) !important; }
  .maplibregl-ctrl-attrib a { color: var(--foam-muted) !important; }

  .foot { max-width: var(--page); margin: 0 auto; padding: 28px var(--gutter) 40px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px 24px; border-top: 1px solid var(--hair); color: var(--muted); font-size: 14px; }
  .foot nav { display: flex; gap: 4px 18px; flex-wrap: wrap; }
  .foot a { color: var(--foam-muted); text-decoration: none; display: inline-flex; min-height: 44px; align-items: center; }
  .foot a:hover { color: var(--foam); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; }
  }
</style>
