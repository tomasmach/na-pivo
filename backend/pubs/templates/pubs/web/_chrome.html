{# The site header, shared by every public page, also the older ones with their own styles. #}
<style>
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 20px; padding: 0 clamp(16px, 4vw, 40px); min-height: 60px; background: rgb(21 18 15 / 0.94); border-bottom: 1px solid rgb(251 243 224 / 0.10); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .topbar .mark { color: #FBF3E0; display: inline-flex; align-items: center; gap: 9px; min-height: 44px; font: 800 20px/1 "Baloo 2", ui-rounded, system-ui, sans-serif; text-decoration: none; white-space: nowrap; }
  .topbar .mark img { width: 28px; height: 28px; border-radius: 50%; }
  .topbar nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .topbar nav::-webkit-scrollbar { display: none; }
  .topbar nav a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 10px; color: #E8DCC0; font-size: 15px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .topbar nav a:hover { color: #FBF3E0; background: #1C1815; }
  .topbar nav a[aria-current="page"] { color: #FBF3E0; background: #262019; }
  .topbar .get { margin-left: auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 11px; background: #262019; color: #FBF3E0; font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap; }
  .topbar .get:hover { background: #2E271F; }
  @media (max-width: 760px) {
    .topbar { flex-wrap: wrap; gap: 0 12px; padding-top: 6px; }
    .topbar nav { order: 3; width: calc(100% + 2 * clamp(16px, 4vw, 40px)); margin: 0 calc(-1 * clamp(16px, 4vw, 40px)); padding: 0 calc(clamp(16px, 4vw, 40px) - 12px) 4px; }
  }

  .topbar :focus-visible { outline: 3px solid #FBF3E0; outline-offset: 3px; border-radius: 6px; }
</style>
