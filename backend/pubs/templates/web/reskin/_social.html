{% comment %}Link preview of a page kept out of search engines, which the shell gives no Open Graph tags.{% endcomment %}<meta property="og:type" content="website">
<meta property="og:site_name" content="Na pivo">
<meta property="og:locale" content="{{ page.og_locale }}">
<meta property="og:title" content="{{ page.title }}">
{% if page.description %}<meta property="og:description" content="{{ page.description }}">{% endif %}
{% if og_url %}<meta property="og:url" content="{{ og_url }}">{% endif %}
{% if og_image_url %}<meta property="og:image" content="{{ og_image_url }}">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ og_image_alt|default:page.title }}">
<meta name="twitter:card" content="summary_large_image">{% endif %}
